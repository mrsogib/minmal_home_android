name: Android Build

# Runs on every push and pull request to any branch, so pushing your "claude"
# branch (or any branch) triggers it automatically.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already ship with a working, pre-licensed Android
      # SDK at ANDROID_HOME (this is why the earlier "android-actions/setup-android"
      # step failed — it tried to reinstall the SDK and reach for a legacy "tools"
      # package Google removed years ago). We just point Gradle at what's already
      # there instead of touching the SDK install at all.
      - name: Confirm Android SDK location
        run: echo "Using preinstalled SDK at $ANDROID_HOME"

      # We ship the project without a compiled gradle-wrapper.jar (a binary that
      # doesn't survive a plain file export), so instead of ./gradlew we install
      # Gradle directly here and use it to build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
